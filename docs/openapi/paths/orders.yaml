orders:
  get:
    tags:
      - Orders

    summary: Get user orders

    description: |
      Returns all orders uploaded by the authenticated user.

    operationId: getOrders

    security:
      - bearerAuth: []

    responses:
      '200':
        description: List of user orders
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/order.yaml#/Order'
            example:
              - number: "12345678903"
                status: PROCESSED
                accrual: 500
                uploadedAt: "2026-09-15T10:30:00Z"
              - number: "98765432109"
                status: NEW
                accrual: null
                uploadedAt: "2026-09-15T11:00:00Z"

      '204':
        description: User has no orders

      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/Error'
            example:
              error: authorization is not valid

      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/Error'

  post:
    tags:
      - Orders

    summary: Upload a new order

    description: |
      Uploads a new order number for the authenticated user.
      The order number is validated before the order is accepted.

    operationId: uploadOrder

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        text/plain:
          schema:
            type: string
          example: "12345678903"

    responses:
      '202':
        description: Order accepted for processing

      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/Error'
            examples:
              emptyNumber:
                summary: Empty order number
                value:
                  error: empty number
              failedToReadBody:
                summary: Failed to read request body
                value:
                  error: failed to read body

      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/Error'
            example:
              error: authorization is not valid

      '409':
        description: Order is already uploaded by another user
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/Error'
            example:
              error: order is loaded by another user

      '422':
        description: Invalid order number format
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/Error'
            example:
              error: invalid order number format

      '500':
        description: Internal server error
