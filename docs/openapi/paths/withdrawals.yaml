getWithdrawals:
  get:
    tags:
      - Withdrawals

    summary: Get user withdrawals

    description: |
      Returns all withdrawals made by the authenticated user.

    operationId: getWithdrawals

    security:
      - bearerAuth: []

    responses:
      '200':
        description: User withdrawals
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/drawal.yaml#/ViewDrawals'
            example:
              - order: "12345678903"
                sum: 100.50
                processed_at: "2026-09-15T10:30:00Z"
              - order: "98765432109"
                sum: 50.00
                processed_at: "2026-09-15T11:30:00Z"

      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/Error'
            example:
              error: user not found
